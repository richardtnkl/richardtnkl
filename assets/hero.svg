<text class="mono" x="1070.0" y="195" font-size="13" text-anchor="middle" fill="#C9D4E3">decide</text>
<rect class="box" style="animation-delay:2.4s" x="935" y="265" width="120" height="40" rx="10" fill="#111827" stroke="url(#edge)" stroke-width="1.6"/>
