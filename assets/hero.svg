</g>
<rect x=".5" y=".5" width="1279" height="339" rx="22" fill="none" stroke="#253047"/>
<text class="mono" x="72" y="92" font-size="14" letter-spacing="3" fill="#22D3EE">BUSINESS INNOVATION  ·  AI &amp; AUTOMATION  ·  ZURICH</text>
<text x="68" y="168" font-size="66" font-weight="800" letter-spacing="-1.5" fill="url(#name)">Richard Thanikkal</text>
<rect x="72" y="190" width="168" height="4" rx="2" fill="url(#edge)"/>
<text class="r r1" x="72" y="236" font-size="21" fill="#8B98A9">I come from the business side and learned to build.</text>
<text class="r r2" x="72" y="236" font-size="21" fill="#8B98A9">Working Student, Business Engineering at Zurich Insurance.</text>
<text class="r r3" x="72" y="236" font-size="21" fill="#8B98A9">M.A. Business Innovation at HSG · hackathon builder.</text>
<text class="mono" x="72" y="292" font-size="14" fill="#8B98A9"><tspan fill="#8B5CF6">$</tspan> turn process problems into shipped tools <tspan class="blink" fill="#22D3EE">▍</tspan></text>
