</defs>
<style>text{font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif} .mono{font-family:'SF Mono','JetBrains Mono',Menlo,Consolas,monospace}
 .r{opacity:0;animation:rot 12s infinite} .r1{opacity:1} .r2{animation-delay:4s} .r3{animation-delay:8s}
 @keyframes rot{0%{opacity:0;transform:translateY(8px)}4%,31%{opacity:1;transform:none}35%,100%{opacity:0;transform:translateY(-6px)}}
 .blink{animation:blink 1.1s steps(1) infinite} @keyframes blink{50%{opacity:0}}
 .box{animation:glowb 6s ease-in-out infinite} @keyframes glowb{0%,100%{stroke-opacity:.55}50%{stroke-opacity:1}}
 @media (prefers-reduced-motion: reduce){*{animation:none!important}} @media (prefers-reduced-motion: reduce){.r1{opacity:1}}
</style>
