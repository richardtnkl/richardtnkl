<title id="t">Historical Photo AI</title><desc id="d">ZENTRAL HACK 2026 · AGENTIC AI. AI image recognition for historical photographs. Built in a team at Zentral Hack 2026 (Agentic AI track) for the Staatsarchiv Schwyz: an agentic pipeline that looks at historical photos, describes what is in them and makes the collection searchable.</desc>
